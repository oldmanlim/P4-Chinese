<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P4 Chinese Vocabulary Challenge</title>
    <style>
        :root { --p: #27ae60; --s: #2c3e50; --bg: #effaf3; --white: #ffffff; }
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg); margin: 0; padding: 10px; display: flex; justify-content: center; }
        .quiz-card { width: 100%; max-width: 500px; background: var(--white); padding: 20px; border-radius: 15px; box-shadow: 0 8px 25px rgba(0,0,0,0.1); border-top: 5px solid var(--p); }
        .header { text-align: center; margin-bottom: 20px; }
        .prog-bg { height: 8px; background: #eee; border-radius: 4px; margin-bottom: 20px; overflow: hidden; }
        .prog-fill { height: 100%; background: var(--p); width: 0%; transition: 0.4s; }
        .cat-tag { font-size: 0.8rem; font-weight: bold; color: var(--p); border: 1px solid var(--p); padding: 2px 8px; border-radius: 5px; background: #eafaf1; }
        .q-text { font-size: 1.25rem; font-weight: 600; margin: 20px 0; line-height: 1.6; color: var(--s); }
        .opt-grid { display: flex; flex-direction: column; gap: 12px; }
        .opt-btn { padding: 15px; border: 2px solid #eee; border-radius: 12px; background: #fff; text-align: left; cursor: pointer; font-size: 1.1rem; transition: 0.2s; color: #444; }
        .opt-btn:hover { border-color: var(--p); background: #f9fdfa; }
        .opt-btn.selected { border-color: var(--p); background: #eafaf1; color: var(--p); font-weight: bold; }
        .feedback { margin-top: 15px; padding: 15px; border-radius: 10px; display: none; line-height: 1.5; font-size: 0.95rem; }
        .feedback.correct { display: block; background: #e9f7ef; color: #1e8449; border: 1px solid #2ecc71; }
        .feedback.wrong { display: block; background: #fdedec; color: #943126; border: 1px solid #e74c3c; }
        button.main-btn { width: 100%; padding: 16px; border-radius: 12px; border: none; font-weight: bold; font-size: 1.1rem; cursor: pointer; margin-top: 20px; transition: 0.3s; }
        .confirm { background: var(--s); color: white; }
        .confirm:disabled { opacity: 0.3; cursor: not-allowed; }
        .next { background: var(--p); color: white; display: none; }
        .result-score { font-size: 4rem; color: var(--p); margin: 10px 0; }
    </style>
</head>
<body>

<div class="quiz-card">
    <div id="quiz-ui">
        <div class="header">
            <h2 style="margin:0; color:var(--p)">P4 华文：词语大挑战</h2>
            <p id="q-counter" style="color:#666; font-size:0.9rem;">趣味练习 10 题</p>
        </div>
        <div class="prog-bg"><div class="prog-fill" id="prog-bar"></div></div>

        <div id="question-area">
            <span class="cat-tag" id="q-cat"></span>
            <div class="q-text" id="q-text"></div>
            <div class="opt-grid" id="opt-grid"></div>
            <div id="feedback" class="feedback"></div>
            <div class="btn-group">
                <button id="btn-confirm" class="main-btn confirm" disabled onclick="confirmAnswer()">确定 (Confirm)</button>
                <button id="btn-next" class="main-btn next" onclick="nextQuestion()">下一题 (Next Question)</button>
            </div>
        </div>
    </div>

    <div id="result-ui" style="display:none; text-align:center;">
        <h2 style="color:var(--s)">太棒了！练习完成</h2>
        <div class="result-score" id="final-score">0/10</div>
        <p id="praise-text" style="color:#666; margin-bottom:20px;"></p>
        <button class="main-btn confirm" onclick="generateNewSet()">再挑战一次 (Try Again)</button>
    </div>
</div>

    "question": "那部电视剧共有三十集，情节非常精彩，让我一读就 ________ 进去了。",
    "options": ["迷", "走", "看", "读"],
    "correctIdx": 0,
    "explanation": "【迷】(mí) Obsessed/Hooked. '迷上/迷进去' (to be captivated)."
  },
  {
    "category": "词语搭配",
    "question": "我们在熟食中心要 ________ 排队，不要插队。",
    "options": ["有秩序地", "乱抢地", "自言自语地", "不耐烦地"],
    "correctIdx": 0,
    "explanation": "【有秩序地】(yǒu zhì xù dì) In an orderly manner. Proper behavior for queuing."
  },
  {
    "category": "关联词",
    "question": "________ 他的家境并不富裕，________ 他学习非常努力。",
    "options": ["虽然...但是", "因为...所以", "不但...而且", "如果...就"],
    "correctIdx": 0,
    "explanation": "【虽然...但是】Contrast between poor background and hard study."
  },
  {
    "category": "汉语拼音",
    "question": "那朵漂亮的蝴【蝶】正停在花盆上。选出正确的拼音。",
    "options": ["dié", "tié", "diě", "diē"],
    "correctIdx": 0,
    "explanation": "【蝶】(dié) Butterfly. Second tone."
  }
    ];

    let currentSet = [];
    let currentIdx = 0;
    let score = 0;
    let selectedIdx = null;

    function generateNewSet() {
        score = 0;
        currentIdx = 0;
        // Randomly pick 10 questions from the P4 bank
        currentSet = [...p4Bank].sort(() => 0.5 - Math.random()).slice(0, 10);
        document.getElementById('result-ui').style.display = 'none';
        document.getElementById('quiz-ui').style.display = 'block';
        showQuestion();
    }

    function showQuestion() {
        const q = currentSet[currentIdx];
        document.getElementById('q-counter').innerText = `第 ${currentIdx + 1} 题 / 共 10 题`;
        document.getElementById('prog-bar').style.width = `${(currentIdx / 10) * 100}%`;
        document.getElementById('q-cat').innerText = q.category;
        document.getElementById('q-text').innerText = q.question;
        
        const grid = document.getElementById('opt-grid');
        grid.innerHTML = '';
        selectedIdx = null;
        
        document.getElementById('feedback').style.display = 'none';
        document.getElementById('btn-confirm').style.display = 'block';
        document.getElementById('btn-confirm').disabled = true;
        document.getElementById('btn-next').style.display = 'none';

        q.options.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerText = `${i + 1}. ${opt}`;
            btn.onclick = () => {
                selectedIdx = i;
                document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                document.getElementById('btn-confirm').disabled = false;
            };
            grid.appendChild(btn);
        });
    }

    function confirmAnswer() {
        const q = currentSet[currentIdx];
        const isCorrect = selectedIdx === q.correctIdx;
        if(isCorrect) score++;

        const fb = document.getElementById('feedback');
        fb.className = `feedback ${isCorrect ? 'correct' : 'wrong'}`;
        fb.innerHTML = `<strong>${isCorrect ? '答对了！太棒了！' : '没关系，再接再厉！'}</strong><br>${q.explanation}`;
        fb.style.display = 'block';

        document.getElementById('btn-confirm').style.display = 'none';
        document.getElementById('btn-next').style.display = 'block';
        document.querySelectorAll('.opt-btn').forEach(b => b.style.pointerEvents = 'none');
    }

    function nextQuestion() {
        currentIdx++;
        if(currentIdx < 10) {
            showQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById('quiz-ui').style.display = 'none';
        document.getElementById('result-ui').style.display = 'block';
        document.getElementById('final-score').innerText = `${score} / 10`;
        
        let praise = "";
        if(score === 10) praise = "太完美了！你是华文小达人！";
        else if(score >= 7) praise = "表现得很好！继续加油！";
        else praise = "多练习几次，你一定会进步的！";
        document.getElementById('praise-text').innerText = praise;
    }

    window.onload = generateNewSet;
</script>
